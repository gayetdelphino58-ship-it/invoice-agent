[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --color=yes"

[tool.coverage.run]
source = ["tools", "web", "scheduler"]
omit = ["tests/*", "infra/*", "*/conftest.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
